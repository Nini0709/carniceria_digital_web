<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Cliente - Carnicería Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
  </head>
  <body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-carniceria sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
          <img src="img/Logo.png" alt="Logo Carnicería Digital" width="45" height="45" class="me-2 rounded-circle border border-2 border-white">
          <span>Carnicería Digital</span>
        </a>
        <div class="d-flex gap-2">
          <a href="index.html" class="btn btn-outline-light btn-sm">Inicio</a>
          <a href="tutorial.html" class="btn btn-warning btn-sm fw-bold text-dark">Tutorial</a>
        </div>
      </div>
    </nav>

    <!-- Formulario de Registro -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <h1 class="h3 fw-bold mb-2 text-center" style="color: var(--color-principal);">Crear Cuenta de Cliente</h1>
            <p class="text-muted text-center small mb-4">Completa tus datos para agilizar tus pedidos a domicilio.</p>

            <form action="comprar.php" method="POST">
              <div class="mb-3">
                <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Camila Rojas" required>
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label fw-semibold">Teléfono / WhatsApp</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej. 3001234567" required>
              </div>

              <div class="mb-4">
                <label for="direccion" class="form-label fw-semibold">Dirección de entrega</label>
                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle, carrera, barrio o localidad" required>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger fw-bold py-2" style="background-color: var(--color-principal); border-color: var(--color-principal);">
                  Registrarme y Continuar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-white py-3 text-center" style="background-color: var(--color-secundario);">
      <small>© 2026 Carnicería Digital</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
